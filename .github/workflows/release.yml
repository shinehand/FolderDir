name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────
  # Windows build – produces FolderDir-windows.zip
  # ─────────────────────────────────────────────
  build-windows:
    name: Windows (MSVC + Qt6)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          cache: true

      - name: Configure (Release)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          $exe = "build\Release\FolderDir.exe"
          $out = "dist\FolderDir-windows"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item $exe $out
          windeployqt.exe --release --no-translations `
              --no-system-d3d-compiler --no-opengl-sw "$out\FolderDir.exe"

      - name: Create ZIP archive
        shell: pwsh
        run: Compress-Archive -Path dist\FolderDir-windows\* -DestinationPath FolderDir-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FolderDir-windows
          path: FolderDir-windows.zip
          retention-days: 7

  # ─────────────────────────────────────────────
  # Linux build – produces FolderDir-linux.tar.gz
  # ─────────────────────────────────────────────
  build-linux:
    name: Linux (GCC + Qt6)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            qt6-base-dev qt6-base-dev-tools \
            libgl1-mesa-dev libglib2.0-dev

      - name: Configure (Release)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja

      - name: Build
        run: cmake --build build --parallel

      - name: Package binary
        run: |
          mkdir -p dist/FolderDir-linux
          cp build/FolderDir dist/FolderDir-linux/
          tar -czf FolderDir-linux.tar.gz -C dist FolderDir-linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FolderDir-linux
          path: FolderDir-linux.tar.gz
          retention-days: 7

  # ─────────────────────────────────────────────
  # macOS build – produces FolderDir-macos.tar.gz
  # ─────────────────────────────────────────────
  build-macos:
    name: macOS (Clang + Qt6)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          host: mac
          target: desktop
          cache: true

      - name: Configure (Release)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja

      - name: Build
        run: cmake --build build --parallel

      - name: Deploy macdeployqt & create DMG
        run: |
          macdeployqt build/FolderDir.app -dmg
          mv build/FolderDir.dmg FolderDir-macos.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FolderDir-macos
          path: FolderDir-macos.dmg
          retention-days: 7

  # ─────────────────────────────────────────────
  # Create GitHub Release and upload all binaries
  # ─────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4.1.3
        with:
          name: FolderDir-windows

      - name: Download Linux artifact
        uses: actions/download-artifact@v4.1.3
        with:
          name: FolderDir-linux

      - name: Download macOS artifact
        uses: actions/download-artifact@v4.1.3
        with:
          name: FolderDir-macos

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: FolderDir ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            FolderDir-windows.zip
            FolderDir-linux.tar.gz
            FolderDir-macos.dmg
          body: |
            ## FolderDir ${{ github.ref_name }}

            ### Downloads

            | Platform | File |
            |----------|------|
            | Windows 10/11 (64-bit) | `FolderDir-windows.zip` |
            | Linux (x86-64) | `FolderDir-linux.tar.gz` |
            | macOS | `FolderDir-macos.dmg` |

            ### Windows installation
            1. Extract `FolderDir-windows.zip`
            2. Run `FolderDir.exe` (no installer needed — all Qt DLLs are included)

            ### Linux installation
            1. Extract `FolderDir-linux.tar.gz`
            2. Make the binary executable: `chmod +x FolderDir`
            3. Ensure Qt 6 libraries are installed (`sudo apt install qt6-base-dev`)
            4. Run `./FolderDir`

            ### macOS installation
            1. Open `FolderDir-macos.dmg`
            2. Drag `FolderDir.app` to your Applications folder
